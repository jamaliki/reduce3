[package]
name = "reduce3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast Rust reimplementation of cctbx Reduce2: add hydrogens and optimize movable groups"
license = "Apache-2.0"
repository = "https://github.com/jamaliki/reduce3"
readme = "README.md"
keywords = ["protein", "hydrogens", "crystallography", "structural-biology", "pdb"]
categories = ["science", "command-line-utilities"]

[dependencies]
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde_json = { version = "1.0.151", optional = true, features = ["float_roundtrip"] }
smallvec = "1.16.2"
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = ["mimalloc"]
# The command-line tool's allocator (the library leaves it to its host).
mimalloc = ["dep:mimalloc"]
# Developer tool: compare against JSON dumps of the original Reduce2.
refcheck = ["dep:serde_json"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
